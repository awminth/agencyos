# SplitDeploy: one Express process serves API + frontend dist/
services:
  - type: web
    name: agencyos
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install --prefix frontend --include=dev && npm install --prefix backend --include=dev && npm run build --prefix backend
    startCommand: npm start --prefix backend
    autoDeploy: true
